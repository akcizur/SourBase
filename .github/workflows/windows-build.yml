name: Sourbase Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: go test ./...
      - name: Static analysis
        run: go vet ./...
      - name: Embedded UI JavaScript syntax
        shell: pwsh
        run: |
          $html = Get-Content -Raw web/index.html
          $script = [regex]::Match($html, '(?s)<script>(.*?)</script>').Groups[1].Value
          if (-not $script) { throw 'Embedded application script was not found.' }
          $script | Set-Content -NoNewline -Encoding utf8 app-check.js
          node --check app-check.js
          Remove-Item app-check.js
      - name: PowerShell connector scripts syntax
        shell: pwsh
        run: |
          $files = @('Start-Sourbase-CSFD.ps1', 'Stop-Sourbase-CSFD.ps1')
          foreach ($file in $files) {
            $parseTokens = $null
            $parseErrors = $null
            $path = (Resolve-Path $file).Path
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parser errors in $file"
            }
          }
      - name: Build Windows x64 EXE
        shell: pwsh
        run: |
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags='-s -w -H=windowsgui' -o 'Sourbase.exe' .
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: sourbase-windows-x64
          path: Sourbase.exe
