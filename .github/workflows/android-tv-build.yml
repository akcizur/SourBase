name: Sourbase Android TV build

on:
  push:
    branches: [main]
    paths:
      - 'android-tv/**'
      - 'docs/ANDROID-TV-ARCHITECTURE.md'
      - '.github/workflows/android-tv-build.yml'
  pull_request:
    paths:
      - 'android-tv/**'
      - 'docs/ANDROID-TV-ARCHITECTURE.md'
      - '.github/workflows/android-tv-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build debug APK and run unit tests
        run: gradle :app:assembleDebug :app:testDebugUnitTest

      - name: Upload Android TV APK
        uses: actions/upload-artifact@v4
        with:
          name: sourbase-android-tv-debug
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
